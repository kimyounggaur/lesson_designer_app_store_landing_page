<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>인형 뽑기 1면 데모 · 레슨디자이너 앱스토어</title>
  <style>
    /* 단독 확인용 1면 레이아웃(설계서 2장). 실제 1면은 외주 사이트가 조립한다. */
    :root {
      --ink: #274458;
      --header-h: 64px;
      --focus: #316b8a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #FFF9F1;
      color: var(--ink);
      font-family: 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif;
      line-height: 1.5;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }
    a:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    .vendor-header {
      height: var(--header-h); display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; border-bottom: 1px solid #E8DCCB; background: #fff;
    }
    .vendor-header strong { font-size: 18px; }
    .vendor-header span { font-size: 16px; }
    .hero {
      --hero-h: min(calc(100svh - var(--header-h) - 48px), 820px); /* 아래 48px에 다음 섹션이 살짝 보이게 */
      max-width: 1200px; margin: 0 auto; padding: 24px 24px;
      display: grid; grid-template-columns: repeat(12, 1fr); column-gap: 32px; align-items: center;
      min-height: var(--hero-h);
    }
    .copy { grid-column: 1 / span 5; }
    .stage { grid-column: 6 / span 7; }
    lesson-claw-machine {
      /* 기계 높이 = 1면 높이 - 상하 여백 48px - 아래 안내 줄 자리(선반은 기계 옆) */
      --lcm-machine-height: calc(var(--hero-h) - 48px - 40px);
    }
    .eyebrow { margin: 0; font-size: 16px; font-weight: 800; }
    h1 { margin: 8px 0 0; font-size: clamp(40px, 4.4vw, 56px); line-height: 1.25; letter-spacing: -0.02em; }
    .lead { margin: 16px 0 0; font-size: 18px; max-width: 30em; }
    .ctas { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    .cta {
      display: inline-flex; align-items: center; min-height: 52px; padding: 0 24px; border-radius: 999px;
      border: 2px solid var(--ink); font-size: 17px; font-weight: 800; text-decoration: none; color: var(--ink); background: #fff;
    }
    .cta-primary { background: var(--ink); color: #fff; }
    .trust { margin: 24px 0 0; font-size: 16px; font-weight: 700; }
    .guide-under { display: none; }
    .next { max-width: 1200px; margin: 0 auto; padding: 32px 24px 80px; border-top: 1px solid #E8DCCB; }
    .next h2 { margin: 0; font-size: 28px; }
    .next p { font-size: 16px; }

    @media (max-width: 1023px) {
      .hero { display: block; min-height: 0; text-align: center; }
      .copy { max-width: 560px; margin: 0 auto 24px; }
      .ctas { justify-content: center; }
      .lead { margin-inline: auto; }
      lesson-claw-machine { --lcm-machine-height: 720px; max-width: 480px; margin: 0 auto; }
    }
    @media (max-width: 767px) {
      .hero { padding: 16px; }
      h1 { font-size: clamp(28px, 8vw, 32px); }
      .lead .more, .copy .cta-secondary, .trust { display: none; }
      .lead { font-size: 16px; }
      lesson-claw-machine { max-width: none; }
      .guide-under { display: flex; justify-content: center; margin-top: 16px; }
    }
  </style>
</head>
<body>
  <header class="vendor-header"><strong>(외주 헤더 자리)</strong><span>메뉴</span></header>
  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="copy">
        <p class="eyebrow">음악 수업을 위한 앱스토어</p>
        <h1 id="hero-title">수업에 쓸 음악 앱,<br>하나 뽑아볼까요?</h1>
        <p class="lead">악기 연주와 운지 교정부터 악보·녹음 도구, 리듬 게임까지.<span class="more"> 선생님과 학생이 함께 쓰는 <span data-app-count>59</span>개 앱을 모았어요.</span></p>
        <div class="ctas">
          <a class="cta cta-primary" href="#apps">앱 둘러보기</a>
          <a class="cta cta-secondary" href="#guide">이용 안내</a>
        </div>
        <p class="trust"><span data-app-count>59</span>개 앱 · 4가지 분류 · 7일 무료 체험</p>
      </div>
      <div class="stage">
        <lesson-claw-machine apps-src="./apps.json" sound="off">
          <p>앱 아이콘을 뽑아 보는 인형 뽑기 기계가 있는 자리예요.</p>
        </lesson-claw-machine>
        <div class="guide-under"><a class="cta" href="#guide">이용 안내</a></div>
      </div>
    </section>
    <section class="next" id="apps">
      <h2>다음 섹션 (외주 담당)</h2>
      <p id="guide">이용 안내, 앱 목록 등 소개 사이트의 나머지 섹션이 이어집니다.</p>
    </section>
  </main>
  <script type="module">
    const params = new URLSearchParams(location.search);
    const machine = document.querySelector('lesson-claw-machine');
    if (params.has('seed')) machine.setAttribute('seed', params.get('seed'));
    if (params.get('sound') === 'on') machine.setAttribute('sound', 'on');
    // 앱 수는 apps.json 길이에서 채운다(하드코딩 금지).
    fetch('./apps.json').then((response) => response.json()).then((data) => {
      for (const node of document.querySelectorAll('[data-app-count]')) node.textContent = data.apps.length;
    }).catch(() => {});
    for (const type of ['claw:start', 'claw:prize', 'claw:miss']) {
      machine.addEventListener(type, (event) => { (window.clawEvents ||= []).push({ type, detail: event.detail }); });
    }
    await import('./claw-machine.js');
  </script>
</body>
</html>
